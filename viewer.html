<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Opening onchain file — find3r</title>
    <script>
      (() => {
        const route = /^(.*?)\/app(?:-full)?\//.exec(location.pathname);
        const base = document.createElement("base");
        base.href = route ? location.origin + route[1] + "/" : new URL("./", location.href).href;
        document.head.append(base);
      })();
    </script>
    <link rel="stylesheet" href="./app.css" />
    <link rel="icon" href="./favicon.svg" />
    <script type="module" src="./viewer.js"></script>
  </head>
  <body class="viewer-body">
    <header class="viewer-bar">
      <a class="wordmark" href="./" target="_blank" rel="noopener">find<span>3</span>r.</a
      ><span id="viewer-status">Loading…</span><code id="viewer-address"></code
      ><button id="viewer-copy-link" type="button" hidden>Copy app link</button
      ><a id="viewer-fullscreen" class="viewer-open-fullscreen" target="_blank" rel="noopener noreferrer" hidden
        >Open full screen ↗</a
      ><a href="./learn.html#rendering" target="_blank" rel="noopener">How this works ↗</a>
    </header>
    <section id="viewer-message" class="viewer-message">
      <h1>Opening your app or file.</h1>
      <p>Getting your page ready. Downloading a whole app first can take longer.</p>
      <p id="viewer-progress" role="status"></p>
    </section>
  </body>
</html>
